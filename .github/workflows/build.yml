name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 编译
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21 —— 与 ZL2 一致
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # gradle/actions 官方 action：自动处理 wrapper 与缓存，不需要手动 gradle wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          add-job-summary: "on-failure"

      # 不手动装 SDK —— ubuntu-latest runner 自带 ANDROID_HOME
      - name: 确认 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: 编译 Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: air2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            build/reports/
          retention-days: 7
